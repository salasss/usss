name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      architectures:
        description: "Android ABIs to build, comma separated"
        required: false
        default: "arm64-v8a"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Public values embedded in the JS bundle at build time (repository secrets).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      # Most phones are 64-bit ARM; one ABI keeps the build fast.
      ABIS: ${{ inputs.architectures || 'arm64-v8a' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning title=Debug signature::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with the debug keystore."
            exit 0
          fi
          keystore="$RUNNER_TEMP/usss-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "USSS_UPLOAD_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: mobile/android
        env:
          # Read by plugins/with-release-signing.js through Gradle.
          USSS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          USSS_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          USSS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          --no-daemon
          -PreactNativeArchitectures="$ABIS"
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK signature
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          # Fails the step when the signature is invalid.
          report=$("${build_tools}apksigner" verify --print-certs "$apk")
          # Signer labels vary across build-tools versions ("Signer #1", "Signer (minSdkVersion=…)").
          echo "$report" | grep -E "certificate (DN|SHA-256 digest|SHA-1 digest)" || echo "$report"
          ls -lh "$apk"

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/usss-release.keystore"
